<style>
a{color:var(--color-link)}a:hover{color:var(--blue-800)}

.sb-principle-num{font-family:var(--font-mono);font-size:14px;line-height:28px;font-weight:500;color:var(--navy-500);font-variant-numeric:tabular-nums}

.sb-diagram{display:flex;flex-direction:column;max-width:420px;width:100%;align-self:center;justify-self:end}

.sb-has-backdrop{position:relative;overflow:hidden}.sb-has-backdrop>.sb-container,.sb-section[data-tone=inverse]>.sb-container{position:relative;z-index:1}
.sb-section[data-tone=inverse]{position:relative;overflow:hidden}
.sb-backdrop{position:absolute;inset:0;pointer-events:none}
.sb-bd-wash{position:absolute;inset:0;background:linear-gradient(180deg,var(--blue-50) 0%,rgba(238,242,255,.55) 40%,rgba(255,255,255,0) 100%)}
.sb-backdrop-health .sb-bd-wash{background:linear-gradient(180deg,var(--teal-50) 0%,rgba(230,246,244,.55) 40%,rgba(255,255,255,0) 100%)}
.sb-bd-dots{position:absolute;inset:0;background:var(--dot-grid);-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 60%);mask-image:linear-gradient(100deg,transparent 10%,#000 60%)}
.sb-bd-cut{position:absolute;top:0;right:0;width:52%;height:100%;opacity:.9}
.sb-bd-cut path{stroke-dasharray:1;stroke-dashoffset:1;animation:sb-draw 1.6s var(--ease-out) .2s forwards}
@keyframes sb-draw{to{stroke-dashoffset:0}}
.sb-spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 320ms var(--ease-out);background:radial-gradient(circle,var(--blue-400) 1.2px,transparent 1.6px) 0 0/24px 24px;-webkit-mask-image:radial-gradient(circle 220px at var(--mx,50%) var(--my,50%),#000 0%,rgba(0,0,0,.35) 45%,transparent 100%);mask-image:radial-gradient(circle 220px at var(--mx,50%) var(--my,50%),#000 0%,rgba(0,0,0,.35) 45%,transparent 100%)}
.sb-spot-inverse{background:radial-gradient(circle,var(--blue-400) 1.2px,transparent 1.6px) 0 0/24px 24px}
.sb-backdrop-health .sb-spot{background:radial-gradient(circle,var(--teal-600) 1.2px,transparent 1.6px) 0 0/24px 24px}
body.sb-bg-flat .sb-backdrop,body.sb-bg-flat .sb-spot{display:none}
body.sb-bg-wash .sb-spot{display:none}

@media (max-width:639px){body{--sb-pad:64px}body.sb-airy{--sb-pad:88px}body.sb-compact{--sb-pad:48px}.sb-container{padding:0 20px}.sb-display-xl{font-size:calc(40px * var(--sb-scale))}.sb-display{font-size:calc(32px * var(--sb-scale))}.sb-grid-2,.sb-grid-3{grid-template-columns:1fr}.sb-flow{grid-template-columns:repeat(2,minmax(0,1fr))}.sb-footer-grid{grid-template-columns:1fr 1fr}.sb-privacy-row{grid-template-columns:1fr;gap:8px}.sb-hero-visual{min-height:0}}

<script type="text/babel">
const { SiteHeader } = window.SaveBytesDesignSystem_ad9a34;
const LINKS = [{ id: 'health', label: 'Health', href: '#/health' }, { id: 'platform', label: 'Platform', href: '#/platform' }, { id: 'about', label: 'About', href: '#/about' }, { id: 'contact', label: 'Contact', href: '#/contact' }];
const META = {
  home: ['SaveBytes · Software that wastes nothing', 'SaveBytes builds fast, focused software from Navi Mumbai, starting with an EHR for Indian clinics.'],
  health: ['SaveBytes Health · EHR for Indian clinics', 'Appointments, queue, vitals, consult and prescriptions on one fast screen. Built for clinics with 2–5 doctors. In development.'],
  about: ['About SaveBytes', 'How a GitHub repository name became a software company, and how we build.'],
  contact: ['Contact SaveBytes', 'Run a clinic in Navi Mumbai or Mumbai? Join early access to SaveBytes Health.'],
  privacy: ['Privacy · SaveBytes', 'How savebytes.in handles the details you send us.'],
};
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "headline": "Software that wastes nothing.",
  "rhythm": "Compact",
  "surfaces": "Bands",
  "backdrop": "Interactive"
}/*EDITMODE-END*/;
const HEADLINES = ['Software that wastes nothing.', 'Less clicking. More seeing patients.', 'Every byte, every click, every minute: accounted for.'];
const fromHash = () => { const h = location.hash.replace(/^#\/?/, ''); return h === 'platform' ? 'platform' : META[h] ? h : (localStorage.getItem('sb-site-page') || 'home'); };
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { const b = document.body.classList; b.toggle('sb-airy', t.rhythm === 'Airy'); b.toggle('sb-compact', t.rhythm === 'Compact'); b.toggle('sb-ruled', t.surfaces === 'Ruled'); b.toggle('sb-grid', t.surfaces === 'Dot grid'); b.toggle('sb-bg-flat', t.backdrop === 'Flat'); b.toggle('sb-bg-wash', t.backdrop === 'Wash'); }, [t.rhythm, t.surfaces, t.backdrop]);
  const [page, setPage] = React.useState(() => { const p = fromHash(); return p === 'platform' ? 'home' : p; });
  const [scrolled, setScrolled] = React.useState(false);
  const [mobile, setMobile] = React.useState(window.innerWidth < 760);
  React.useEffect(() => { const s = () => setScrolled(window.scrollY > 8); const r = () => setMobile(window.innerWidth < 760); s(); window.addEventListener('scroll', s, { passive: true }); window.addEventListener('resize', r); return () => { window.removeEventListener('scroll', s); window.removeEventListener('resize', r); }; }, []);
  React.useEffect(() => { const [t, d] = META[page]; document.title = t; document.querySelector('meta[name=description]').setAttribute('content', d); }, [page]);
  const go = id => {
    if (id === 'platform') { setPage('home'); localStorage.setItem('sb-site-page', 'home'); history.replaceState(null, '', '#/platform'); setTimeout(() => { const el = document.getElementById('platform'); el && window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' }); }, 60); return; }
    setPage(id); localStorage.setItem('sb-site-page', id); history.replaceState(null, '', '#/' + (id === 'home' ? '' : id)); window.scrollTo(0, 0);
  };
  React.useEffect(() => { if (location.hash === '#/platform') go('platform'); }, []);
  const P = { home: HomePage, health: HealthPage, about: AboutPage, contact: ContactPage, privacy: PrivacyPage }[page] || HomePage;
  return (
    <>
      <SiteHeader links={LINKS} active={page} onNavigate={go} onCta={() => go('contact')} scrolled={scrolled} mobile={mobile} tone={page === 'health' ? 'health' : 'brand'} />
      <main data-screen-label={page} style={{ marginTop: 'calc(-1 * var(--header-height))', paddingTop: 'var(--header-height)' }}><P key={page} go={go} headline={t.headline} /></main>
      <Footer go={go} />
      <TweaksPanel>
        <TweakSection label="Message" />
        <TweakSelect label="Home headline" value={t.headline} options={HEADLINES} onChange={v => { setTweak('headline', v); if (page !== 'home') go('home'); }} />
        <TweakSection label="Feel" />
        <TweakRadio label="Rhythm" value={t.rhythm} options={['Compact', 'Standard', 'Airy']} onChange={v => setTweak('rhythm', v)} />
        <TweakRadio label="Surfaces" value={t.surfaces} options={['Bands', 'Ruled', 'Dot grid']} onChange={v => setTweak('surfaces', v)} />
        <TweakRadio label="Backdrop" value={t.backdrop} options={['Flat', 'Wash', 'Interactive']} onChange={v => setTweak('backdrop', v)} />
      </TweaksPanel>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
