<!-- @dsCard group="Brand" viewport="700x200" name="Logo motion" subtitle="Intro 1.6s (replays), loader, hover breathe. Click to replay." -->
<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;display:flex;gap:40px;align-items:center;cursor:pointer}.cap{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);margin-top:10px;text-align:center}
.sb-block{transform-box:fill-box;transform-origin:center;animation:sb-land 320ms cubic-bezier(.2,.8,.2,1) both}
.sb-cut{stroke-dasharray:1;stroke-dashoffset:1;animation:sb-cut 580ms cubic-bezier(.6,0,.2,1) 320ms forwards}
.sb-l{animation:sb-l 700ms cubic-bezier(.3,.7,.3,1) 900ms both}.sb-r{animation:sb-r 700ms cubic-bezier(.3,.7,.3,1) 900ms both}
.loop .sb-cut{animation:sb-cut-loop 1400ms cubic-bezier(.6,0,.2,1) infinite}
.hov path{transition:transform 200ms var(--ease-out)}.hov:hover .sb-l{transform:translate(-1.5px,.6px)}.hov:hover .sb-r{transform:translate(1.5px,-.6px)}
</style></head><body>
<div><div id="intro"></div><div class="cap">INTRO · 1600ms</div></div>
<div><svg class="loop" viewBox="0 0 48 48" width="64" height="64"><defs><clipPath id="b-c"><rect width="48" height="48" rx="16"/></clipPath><mask id="b-m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path class="sb-cut" pathLength="1" d="M34 -8C34 24 14 24 14 56" fill="none" stroke="#000" stroke-width="5"/></mask></defs><g clip-path="url(#b-c)" mask="url(#b-m)"><path d="M-8 -8H34C34 24 14 24 14 56H-8Z" fill="var(--color-brand)"/><path d="M56 -8H34C34 24 14 24 14 56H56Z" fill="var(--color-brand)"/></g></svg><div class="cap">LOADER · 1400ms</div></div>
<div><svg class="hov" viewBox="0 0 48 48" width="64" height="64"><defs><clipPath id="c-c"><rect width="48" height="48" rx="16"/></clipPath><mask id="c-m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path d="M34 -8C34 24 14 24 14 56" fill="none" stroke="#000" stroke-width="5"/></mask></defs><g clip-path="url(#c-c)" mask="url(#c-m)"><path class="sb-l" style="animation:none" d="M-8 -8H34C34 24 14 24 14 56H-8Z" fill="var(--color-brand)"/><path class="sb-r" style="animation:none" d="M56 -8H34C34 24 14 24 14 56H56Z" fill="var(--color-brand)"/></g></svg><div class="cap">HOVER · 200ms</div></div>
<div style="font-size:13px;line-height:20px;color:var(--color-text-secondary);max-width:200px">Land → cut → breathe → settle. Reduced motion: final state, 200ms fade.</div>
<script>
const tpl='<svg viewBox="0 0 48 48" width="112" height="112"><defs><clipPath id="a-c"><rect width="48" height="48" rx="16"/></clipPath><mask id="a-m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path class="sb-cut" pathLength="1" d="M34 -8C34 24 14 24 14 56" fill="none" stroke="#000" stroke-width="5"/></mask></defs><g class="sb-block"><g clip-path="url(#a-c)" mask="url(#a-m)"><path class="sb-l" d="M-8 -8H34C34 24 14 24 14 56H-8Z" fill="var(--color-brand)"/><path class="sb-r" d="M56 -8H34C34 24 14 24 14 56H56Z" fill="var(--color-brand)"/></g></g></svg>';
const play=()=>{document.getElementById('intro').innerHTML=tpl};play();setInterval(play,4000);document.body.onclick=play;
</script></body></html>
