<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces and lines" subtitle="Semantic surface, line and border tokens." -->
<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:#fff}.mono{font-family:var(--font-mono)}.cap{font-size:12px;line-height:16px;color:var(--color-text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-surface);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">surface</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-surface-subtle);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">surface-subtle</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-surface-sunken);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">surface-sunken</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-surface-inverse);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">surface-inverse</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-line);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">line</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-line-strong);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">line-strong</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-border-control);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">border-control</div></div></div></body></html>
