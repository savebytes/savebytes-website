<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:#fff}.mono{font-family:var(--font-mono)}.cap{font-size:12px;line-height:16px;color:var(--color-text-muted)}</style></head><body><style>.tr{height:6px;background:var(--navy-100);border-radius:3px;position:relative;overflow:hidden}.tr i{position:absolute;left:0;top:0;height:6px;width:24px;border-radius:3px;background:var(--blue-600);animation:mv 2.4s infinite}@keyframes mv{0%,20%{left:0}60%,100%{left:calc(100% - 24px)}}</style><div style="display:grid;grid-template-columns:150px 1fr 160px;gap:10px 16px;align-items:center;font-size:13px"><div class="mono">duration-fast · 120ms</div><div class="tr"><i style="animation-timing-function:var(--ease-out)"></i></div><div class="cap">Hover, press</div><div class="mono">duration-base · 200ms</div><div class="tr"><i style="animation-timing-function:var(--ease-out)"></i></div><div class="cap">Menus, tabs, tooltips</div><div class="mono">duration-slow · 320ms</div><div class="tr"><i style="animation-timing-function:var(--ease-in-out)"></i></div><div class="cap">Dialogs, drawers</div><div class="mono">duration-logo · 1600ms</div><div class="tr"><i style="animation-timing-function:var(--ease-in-out)"></i></div><div class="cap">Logo intro</div></div><div class="mono cap" style="margin-top:10px">ease-out cubic-bezier(.2,.8,.2,1) · ease-in-out cubic-bezier(.6,0,.2,1)</div></body></html>
