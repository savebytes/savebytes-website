<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:#fff}.mono{font-family:var(--font-mono)}.cap{font-size:12px;line-height:16px;color:var(--color-text-muted)}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:32px;width:96px;border:1px dashed var(--blue-400);border-radius:6px;background:var(--blue-50);display:flex;align-items:center;justify-content:center" class="mono cap">32px</div><div class="mono cap">control-sm</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:40px;width:120px;border:1px dashed var(--blue-400);border-radius:6px;background:var(--blue-50);display:flex;align-items:center;justify-content:center" class="mono cap">40px</div><div class="mono cap">control-md</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;width:144px;border:1px dashed var(--blue-400);border-radius:6px;background:var(--blue-50);display:flex;align-items:center;justify-content:center" class="mono cap">48px</div><div class="mono cap">control-lg</div></div><div class="cap" style="margin-left:16px">Touch targets ≥ 44 × 44.<br>Compact clinical density uses control-sm.</div></div></body></html>
