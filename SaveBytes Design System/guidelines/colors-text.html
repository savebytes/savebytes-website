<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:#fff}.mono{font-family:var(--font-mono)}.cap{font-size:12px;line-height:16px;color:var(--color-text-muted)}</style></head><body><div style="display:flex;gap:28px;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:4px"><div style="color:var(--color-text);font-size:18px;font-weight:600">text · navy-900</div><div style="color:var(--color-text-secondary)">text-secondary · navy-700</div><div style="color:var(--color-text-muted);font-size:14px">text-muted · navy-600</div><a href="#" style="font-size:14px">link · blue-700</a></div><div style="display:grid;grid-template-columns:repeat(4,80px);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-brand);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">brand</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-brand-hover);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">brand-hover</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-brand-pressed);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">brand-pressed</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;border-radius:6px;background:var(--color-brand-soft);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;line-height:14px;color:var(--color-text)">brand-soft</div></div></div></div></body></html>
