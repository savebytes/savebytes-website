<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:#fff}.mono{font-family:var(--font-mono)}.cap{font-size:12px;line-height:16px;color:var(--color-text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div><div style="height:56px;border-radius:6px;background:var(--teal-50);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;margin-top:6px">teal-50 #E6F6F4</div><div class="cap">Tinted backgrounds</div></div><div><div style="height:56px;border-radius:6px;background:var(--teal-600);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;margin-top:6px">teal-600 #0E9F8E</div><div class="cap">Mark half, accents (text 24px+)</div></div><div><div style="height:56px;border-radius:6px;background:var(--teal-700);border:1px solid var(--color-line)"></div><div class="mono" style="font-size:11px;margin-top:6px">teal-700 #0B7D70</div><div class="cap">Accent text, any size</div></div></div></body></html>
