<!-- @dsCard group="Colors" viewport="700x140" name="Status" subtitle="Fixed status colours. Always paired with an icon and a word." -->
<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:#fff}.mono{font-family:var(--font-mono)}.cap{font-size:12px;line-height:16px;color:var(--color-text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="border-radius:6px;overflow:hidden;border:1px solid var(--color-line)"><div style="background:var(--color-success);height:36px;color:#fff;font-size:13px;font-weight:500;padding:8px 10px">success</div><div style="background:var(--color-success-soft);color:var(--color-success);padding:8px 10px;font-size:12px;line-height:16px"><span class="mono">#0F7552 / #E7F6EF</span><br>Completed, normal, saved</div></div><div style="border-radius:6px;overflow:hidden;border:1px solid var(--color-line)"><div style="background:var(--color-warning);height:36px;color:#fff;font-size:13px;font-weight:500;padding:8px 10px">warning</div><div style="background:var(--color-warning-soft);color:var(--color-warning);padding:8px 10px;font-size:12px;line-height:16px"><span class="mono">#B45309 / #FEF3E2</span><br>Abnormal, pending</div></div><div style="border-radius:6px;overflow:hidden;border:1px solid var(--color-line)"><div style="background:var(--color-danger);height:36px;color:#fff;font-size:13px;font-weight:500;padding:8px 10px">danger</div><div style="background:var(--color-danger-soft);color:var(--color-danger);padding:8px 10px;font-size:12px;line-height:16px"><span class="mono">#C8102E / #FDECEE</span><br>Errors, allergies, critical</div></div><div style="border-radius:6px;overflow:hidden;border:1px solid var(--color-line)"><div style="background:var(--color-info);height:36px;color:#fff;font-size:13px;font-weight:500;padding:8px 10px">info</div><div style="background:var(--color-info-soft);color:var(--color-info);padding:8px 10px;font-size:12px;line-height:16px"><span class="mono">#2448E0 / #EEF2FF</span><br>Neutral information</div></div></div></body></html>
