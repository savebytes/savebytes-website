div></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="height:72px;width:100%;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-line);border-radius:10px;position:relative"><img src="../assets/logos/savebytes-mark.svg" style="width:40px;height:40px;border-radius:50%;background:var(--blue-50);padding:10px"><span style="position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--color-danger) 50%,transparent calc(50% + 1px))"></span></div><div class="cap">In a circle</div></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="height:72px;width:100%;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-line);border-radius:10px;position:relative"><img src="../assets/logos/savebytes-mark.svg" style="width:40px;height:40px;filter:hue-rotate(120deg)"><span style="position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--color-danger) 50%,transparent calc(50% + 1px))"></span></div><div class="cap">Recolour</div></div></div></body></html>
