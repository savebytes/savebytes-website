<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaveBytes Health</title>
<link rel="icon" href="../../assets/logos/savebytes-favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{font-size:14px;line-height:20px}
/* White-label example: tenant swaps only the brand scale (primary #6B2C91, 8.9:1 on white). */
.tenant{--blue-50:#F5EEF9;--blue-100:#EADCF2;--blue-200:#D4B8E4;--blue-300:#B98FD2;--blue-400:#9C66BC;--blue-500:#8446A8;--blue-600:#6B2C91;--blue-700:#5A2479;--blue-800:#481C61;--blue-900:#36154A}
</style></head><body><div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="QueueScreen.jsx"></script>
<script type="text/babel" src="ConsultScreen.jsx"></script>
<script type="text/babel" src="AppointmentsScreen.jsx"></script>
<script type="text/babel">
const { Toast, SearchInput, EmptyState, Card, Button } = window.SaveBytesDesignSystem_ad9a34;
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('sbh-screen') || 'queue');
  const [token, setToken] = React.useState(7);
  const [queue, setQueue] = React.useState(INITIAL_QUEUE);
  const [tenant, setTenant] = React.useState('savebytes');
  const [msg, setMsg] = React.useState(null);
  React.useEffect(() => { document.documentElement.classList.toggle('tenant', tenant === 'tenant'); }, [tenant]);
  const go = s => { setScreen(s); localStorage.setItem('sbh-screen', s); };
  const toast = m => setMsg({ m, k: Date.now() });
  const waiting = queue.filter(r => ['booked', 'arrived', 'vitals', 'in-consult'].includes(r.status)).length;
  const titles = { queue: 'OPD queue', consult: 'Consult', appointments: 'Appointments', patients: 'Patients', settings: 'Settings' };
  const toolbar = <div style={{ width: 340 }}><SearchInput size="sm" placeholder="Find patient by name, mobile or MRN" options={Object.entries(PATIENTS).map(([t, p]) => ({ value: t, label: p.name, meta: p.mrn }))} onSelect={o => { setToken(+o.value); go('consult'); }} /></div>;
  let body;
  if (screen === 'queue') body = <QueueScreen queue={queue} setQueue={setQueue} toast={toast} openConsult={t => { setToken(t); go('consult'); }} />;
  else if (screen === 'consult') body = <ConsultScreen key={token} token={token} queue={queue} setQueue={setQueue} toast={toast} back={() => go('queue')} />;
  else if (screen === 'appointments') body = <AppointmentsScreen />;
  else body = <div style={{ padding: 20, maxWidth: 1040 }}><Card><EmptyState icon={screen === 'patients' ? 'users' : 'settings'} title="Not part of this kit">This screen is not defined in the source spec yet.</EmptyState></Card></div>;
  return (
    <>
      <Shell screen={screen} setScreen={go} tenant={tenant} setTenant={setTenant} title={titles[screen]} toolbar={toolbar} counts={{ queue: waiting, appts: 14 }}>{body}</Shell>
      {msg && <Toast key={msg.k} floating tone="success" onClose={() => setMsg(null)}>{msg.m}</Toast>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
