<script type="text/babel">
const { SiteHeader } = window.SaveBytesDesignSystem_ad9a34;
const LINKS = [{ id: 'health', label: 'Health' }, { id: 'platform', label: 'Platform' }, { id: 'about', label: 'About' }, { id: 'contact', label: 'Contact' }];
function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem('sb-web-page') || 'home');
  const [scrolled, setScrolled] = React.useState(false);
  const [mobile, setMobile] = React.useState(window.innerWidth < 760);
  React.useEffect(() => { const s = () => setScrolled(window.scrollY > 8); const r = () => setMobile(window.innerWidth < 760); window.addEventListener('scroll', s, { passive: true }); window.addEventListener('resize', r); return () => { window.removeEventListener('scroll', s); window.removeEventListener('resize', r); }; }, []);
  const go = id => {
    if (id === 'platform') { setPage('home'); localStorage.setItem('sb-web-page', 'home'); setTimeout(() => { const el = document.getElementById('platform'); el && window.scrollTo({ top: el.offsetTop - 72, behavior: 'smooth' }); }, 50); return; }
    if (id === 'privacy') id = 'contact';
    setPage(id); localStorage.setItem('sb-web-page', id); window.scrollTo(0, 0);
  };
  const P = { home: HomePage, health: HealthPage, about: AboutPage, contact: ContactPage }[page] || HomePage;
  return (
    <>
      <SiteHeader links={LINKS} active={page} onNavigate={go} onCta={() => go('contact')} scrolled={scrolled} mobile={mobile} tone={page === 'health' ? 'health' : 'brand'} />
      <main style={{ marginTop: 'calc(-1 * var(--header-height))', paddingTop: 'var(--header-height)' }}><P go={go} /></main>
      <Footer go={go} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
