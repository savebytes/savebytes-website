<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Category standard sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1f;--soft:#6e6e73;--ground:#fff;--tile:#f5f5f7;--blue:#2F5BFF}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:var(--ground);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;overflow:hidden;text-align:center}
header{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 64px;text-align:left}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;letter-spacing:-.02em}
nav{display:flex;gap:28px;font-size:15px;color:var(--soft)}
h1{margin-top:120px;font-size:80px;line-height:1.02;letter-spacing:-.03em;font-weight:600}
p.sub{margin:24px auto 0;font-size:24px;line-height:1.4;color:var(--soft);max-width:36ch}
.links{margin-top:32px;display:flex;justify-content:center;gap:24px;font-size:19px}
.links .btn{background:var(--blue);color:#fff;padding:12px 24px;border-radius:999px}
.links a{color:var(--blue);padding:12px 0}
.tile{margin:96px 64px 0;background:var(--tile);border-radius:24px;height:300px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.tile h2{font-size:44px;font-weight:600;letter-spacing:-.02em}
.tile p{font-size:20px;color:var(--soft)}
</style></head><body>
<header><div class="brand"><svg viewBox="0 0 48 48" width="28" height="28"><defs><clipPath id="c"><rect width="48" height="48" rx="16"/></clipPath><mask id="m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path d="M34 -8C34 24 14 24 14 56" stroke="#000" stroke-width="5" fill="none"/></mask></defs><g clip-path="url(#c)" mask="url(#m)"><rect x="-8" y="-8" width="64" height="64" fill="#2F5BFF"/></g></svg>SaveBytes</div>
<nav><span>Health</span><span>About</span><span>Contact</span></nav></header>
<h1>Quiet software<br>for busy places.</h1>
<p class="sub">Focused software from Navi Mumbai, starting with patient records for clinics.</p>
<div class="links"><span class="btn">Get in touch</span><a>Meet SaveBytes Health ›</a></div>
<div class="tile"><h2>SaveBytes Health</h2><p>Patient records for clinics, in one place.</p></div>
</body></html>
