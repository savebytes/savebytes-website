<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wayfinding sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111315;--soft:#5d636c;--ground:#fff;--blue:#2F5BFF;--step:#f3f4f6}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:var(--ground);color:var(--ink);font-family:"Atkinson Hyperlegible Next",system-ui,sans-serif;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;height:76px;padding:0 64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;letter-spacing:-.02em}
nav{display:flex;gap:32px;font-size:16px;font-weight:500;align-items:center}
.btn{display:inline-flex;align-items:center;height:44px;padding:0 20px;background:var(--blue);color:#fff;font-weight:700;border-radius:999px}
main{padding:96px 64px 0}
h1{font-size:96px;line-height:1;letter-spacing:-.035em;font-weight:700;max-width:13ch}
p.sub{margin-top:28px;font-size:22px;line-height:1.45;color:var(--soft);max-width:44ch}
.dir{margin-top:88px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dir div{background:var(--step);padding:28px 32px;display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:700}
.dir small{display:block;font-size:16px;font-weight:400;color:var(--soft);margin-top:6px}
.arrow{font-size:32px}
</style></head><body>
<header><div class="brand"><svg viewBox="0 0 48 48" width="30" height="30"><defs><clipPath id="c"><rect width="48" height="48" rx="16"/></clipPath><mask id="m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path d="M34 -8C34 24 14 24 14 56" stroke="#000" stroke-width="5" fill="none"/></mask></defs><g clip-path="url(#c)" mask="url(#m)"><rect x="-8" y="-8" width="64" height="64" fill="#2F5BFF"/></g></svg>SaveBytes</div>
<nav><span>Health</span><span>About</span><span class="btn">Get in touch</span></nav></header>
<main>
  <h1>Quiet software for busy places.</h1>
  <p class="sub">SaveBytes builds focused software from Navi Mumbai, starting with patient records for clinics.</p>
  <div class="dir">
    <div><span>SaveBytes Health<small>Patient records for clinics</small></span><span class="arrow">→</span></div>
    <div><span>About<small>Why we build this way</small></span><span class="arrow">→</span></div>
    <div><span>Contact<small>Email or WhatsApp</small></span><span class="arrow">→</span></div>
  </div>
</main>
</body></html>
